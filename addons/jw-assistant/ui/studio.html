<!doctype html>
<html lang="ja" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Fresco Studio</title>
<link rel="stylesheet" href="studio.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-sidebar" viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="13" rx="3"/><path d="M7.5 3.5v13"/></symbol>
  <symbol id="i-inspector" viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="13" rx="3"/><path d="M12.5 3.5v13"/></symbol>
  <symbol id="i-cursor" viewBox="0 0 20 20"><path d="M5 3.5l10 6.2-4.4 1.1L8.7 15z"/></symbol>
  <symbol id="i-hand" viewBox="0 0 20 20"><path d="M7 10V5.2a1.2 1.2 0 012.4 0V9m0-4.6V4a1.2 1.2 0 012.4 0v5m0-4a1.2 1.2 0 012.4 0v5.5c0 3.3-2 5.5-5 5.5-2.2 0-3.4-1-4.6-3L4.5 11a1.1 1.1 0 011.8-1.2L7 10.8"/></symbol>
  <symbol id="i-fit" viewBox="0 0 20 20"><path d="M3.5 7.5v-4h4M16.5 7.5v-4h-4M3.5 12.5v4h4M16.5 12.5v4h-4"/></symbol>
  <symbol id="i-gear" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></symbol>
  <symbol id="i-help" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M7.9 7.8a2.2 2.2 0 014.2.9c0 1.5-2.1 1.8-2.1 3.2M10 14.2v.1"/></symbol>
  <symbol id="i-send" viewBox="0 0 20 20"><path d="M10 15.5v-11M5.5 9L10 4.5 14.5 9"/></symbol>
  <symbol id="i-doc" viewBox="0 0 20 20"><path d="M5.5 2.5h6l3.5 3.5v11.5h-9.5z"/><path d="M11.5 2.5V6H15"/></symbol>
  <symbol id="i-folder" viewBox="0 0 20 20"><path d="M2.5 5.5a1.5 1.5 0 011.5-1.5h3.6l1.6 1.8H16a1.5 1.5 0 011.5 1.5v7.7a1.5 1.5 0 01-1.5 1.5H4a1.5 1.5 0 01-1.5-1.5z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 20 20"><path d="M15.5 9.5a5.5 5.5 0 10-1.6 4.2M15.5 4.5v5h-5"/></symbol>
  <symbol id="i-check" viewBox="0 0 20 20"><path d="M5 10.5l3.2 3.2L15 6.8"/></symbol>
  <symbol id="i-x" viewBox="0 0 20 20"><path d="M6 6l8 8M14 6l-8 8"/></symbol>
  <symbol id="i-sparkle" viewBox="0 0 20 20"><path d="M10 3l1.6 4.6L16 9.2l-4.4 1.6L10 15.5l-1.6-4.7L4 9.2l4.4-1.6z"/></symbol>
  <symbol id="i-plan" viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="1.5"/><path d="M3 10h6v7M9 3v4M13 10v7M13 10h4"/></symbol>
  <symbol id="i-play" viewBox="0 0 20 20"><path d="M7 5.5v9l7-4.5z"/></symbol>
  <symbol id="i-blueprint" viewBox="0 0 64 64"><rect x="8" y="12" width="48" height="40" rx="4"/><path d="M8 30h20v22M28 12v10M40 30v22M40 30h16M28 40h12"/><path d="M14 46h8M46 18v6" opacity=".5"/></symbol>
</svg>

<div class="app" id="app">
  <header class="titlebar material" id="titlebar">
    <div class="tb-group">
      <button class="icon-btn" id="toggle-sidebar" type="button" aria-pressed="true" aria-controls="sidebar"><svg><use href="#i-sidebar"/></svg><span class="vh" data-i18n="toggleSidebar"></span></button>
      <div class="doc-title">
        <span class="app-name" data-i18n="appName"></span>
        <span class="doc-name" id="doc-name"></span>
        <span class="doc-chip" id="doc-chip" hidden></span>
      </div>
    </div>
    <div class="tb-group tb-center" id="canvas-tools" hidden>
      <div class="segmented" role="radiogroup" id="tool-seg">
        <button type="button" role="radio" aria-checked="true" data-tool="select"><svg><use href="#i-cursor"/></svg><span data-i18n="toolSelect"></span><kbd>V</kbd></button>
        <button type="button" role="radio" aria-checked="false" data-tool="pan"><svg><use href="#i-hand"/></svg><span data-i18n="toolPan"></span><kbd>H</kbd></button>
      </div>
      <button class="icon-btn" id="zoom-out" type="button"><span aria-hidden="true">−</span><span class="vh" data-i18n="zoomOut"></span></button>
      <button class="zoom-readout" id="zoom-readout" type="button">100%</button>
      <button class="icon-btn" id="zoom-in" type="button"><span aria-hidden="true">+</span><span class="vh" data-i18n="zoomIn"></span></button>
      <button class="icon-btn" id="fit" type="button"><svg><use href="#i-fit"/></svg><span class="vh" data-i18n="fit"></span></button>
    </div>
    <div class="tb-group tb-right">
      <button class="pill-btn" id="open-generator" type="button" hidden><svg><use href="#i-plan"/></svg><span data-i18n="generator"></span></button>
      <a class="text-link" href="./" data-i18n="review"></a>
      <button class="icon-btn" id="open-shortcuts" type="button"><svg><use href="#i-help"/></svg><span class="vh" data-i18n="shortcuts"></span></button>
      <button class="icon-btn" id="open-settings" type="button"><svg><use href="#i-gear"/></svg><span class="vh" data-i18n="settings"></span></button>
      <button class="icon-btn" id="toggle-inspector" type="button" aria-pressed="true" aria-controls="inspector"><svg><use href="#i-inspector"/></svg><span class="vh" data-i18n="toggleInspector"></span></button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas class="layer-base" id="canvas-base" aria-hidden="true"></canvas>
    <canvas class="layer-compare" id="canvas-compare-a" aria-hidden="true"></canvas>
    <canvas class="layer-compare" id="canvas-compare-b" aria-hidden="true"></canvas>
    <canvas class="layer-overlay" id="canvas-overlay" tabindex="0" role="application" aria-describedby="canvas-help"></canvas>
    <p class="vh" id="canvas-help" data-i18n="canvasLabel"></p>
    <div class="empty" id="empty">
      <svg class="empty-art" aria-hidden="true"><use href="#i-blueprint"/></svg>
      <h1 data-i18n="emptyTitle"></h1>
      <p data-i18n="emptyBody"></p>
      <pre class="empty-hint" id="empty-hint" hidden></pre>
      <div class="empty-actions"><button class="btn" id="empty-search" type="button" data-i18n="searchFiles"></button><button class="btn primary" id="empty-generate" type="button" data-i18n="generator" hidden></button></div>
    </div>
    <div class="loading" id="loading" hidden><div class="shimmer-bar"></div><span data-i18n="loading"></span></div>
    <div class="focus-chip" id="focus-chip" hidden role="status"></div>
    <div class="hud" id="hud" hidden><span id="hud-cursor"></span><span class="hud-sep"></span><span id="hud-scale"></span></div>
  </main>

  <aside class="sidebar material panel" id="sidebar" aria-label="">
    <section class="side-section" aria-labelledby="files-h">
      <div class="section-head"><h2 id="files-h" data-i18n="files"></h2><button class="icon-btn small" id="refresh-files" type="button"><svg><use href="#i-refresh"/></svg><span class="vh" data-i18n="refresh"></span></button></div>
      <label class="search"><span class="vh" data-i18n="searchFiles"></span><input id="file-search" type="search" autocomplete="off" spellcheck="false"></label>
      <div class="file-list" id="file-list" role="list"></div>
    </section>
    <section class="side-section grow" aria-labelledby="layers-h">
      <div class="section-head"><h2 id="layers-h" data-i18n="layers"></h2><div class="head-tools"><button class="text-btn" id="layers-all" type="button" data-i18n="showAll" hidden></button><div class="segmented mini" role="radiogroup" id="layer-sort" hidden><button type="button" role="radio" aria-checked="true" data-sort="id" data-i18n="sortId"></button><button type="button" role="radio" aria-checked="false" data-sort="count" data-i18n="sortCount"></button></div></div></div>
      <div class="layer-list" id="layer-list"></div>
    </section>
  </aside>

  <aside class="inspector material panel" id="inspector" aria-label="">
    <div class="segmented full" role="tablist" id="insp-tabs">
      <button type="button" role="tab" aria-selected="true" data-tab="selection" id="tab-selection" aria-controls="insp-selection" data-i18n="inspectorSelection"></button>
      <button type="button" role="tab" aria-selected="false" data-tab="check" id="tab-check" aria-controls="insp-check"><span data-i18n="inspectorCheck"></span><span class="count-badge" id="check-count" hidden></span></button>
    </div>
    <div class="insp-body" id="insp-selection" role="tabpanel" aria-labelledby="tab-selection"></div>
    <div class="insp-body" id="insp-check" role="tabpanel" aria-labelledby="tab-check" hidden></div>
  </aside>

  <div class="command-dock" id="dock">
    <div class="notice material" id="key-notice" hidden>
      <div class="notice-text"><strong data-i18n="keyNotSetTitle"></strong><span data-i18n="keyNotSetBody"></span></div>
      <button class="text-btn" id="notice-dismiss" type="button" data-i18n="dismiss"></button>
    </div>
    <form class="commandbar material" id="commandbar" autocomplete="off">
      <button class="provider-pill" id="provider-btn" type="button" aria-haspopup="menu" aria-expanded="false"><span class="dot" id="provider-dot"></span><span id="provider-label"></span></button>
      <span class="sel-chip" id="sel-chip" hidden></span>
      <label class="cmd-input"><span class="vh" data-i18n="send"></span><input id="command" type="text" maxlength="2000" enterkeyhint="send"></label>
      <span class="status-text" id="work-status" aria-live="polite"></span>
      <kbd class="cmd-kbd" id="cmd-kbd">⌘K</kbd>
      <button class="send-btn" id="send" type="submit" disabled><svg class="send-arrow"><use href="#i-send"/></svg><svg class="saved-check"><use href="#i-check"/></svg><span class="vh" data-i18n="send"></span></button>
    </form>
    <section class="sheet proposal" id="proposal" hidden aria-live="polite" tabindex="-1"><div class="p-content" id="proposal-content"></div></section>
    <div class="menu material" id="provider-menu" role="menu" hidden data-popover></div>
  </div>

  <div class="drag-chip" id="drag-chip" hidden aria-hidden="true"><span class="dx"></span><span class="dy"></span><span class="snap"></span></div>
  <ol class="toaster" id="toaster" aria-live="polite"></ol>

  <section class="sheet popover material" id="settings" hidden data-popover role="dialog" aria-labelledby="settings-h" tabindex="-1"></section>
  <section class="sheet popover material" id="shortcuts" hidden data-popover role="dialog" aria-labelledby="shortcuts-h" tabindex="-1"></section>
  <section class="sheet popover material wide" id="generator" hidden data-popover role="dialog" aria-labelledby="generator-h" tabindex="-1"></section>
  <div class="live vh" id="live" aria-live="polite"></div>
</div>
<script type="module" src="studio.mjs"></script>
</body>
</html>
